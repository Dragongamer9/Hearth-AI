name: deb package
# Builds the prototype .deb and uploads it as a workflow artifact (a download
# on the run page). It never creates a release or a tag.
on:
  push:
  workflow_dispatch:
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Build the .deb
        run: bash packaging/build-deb.sh
      - name: Install it on this clean machine and run its self-test
        run: |
          sudo dpkg -i dist/*.deb
          dpkg -s ithil-prototype | grep -E '^(Package|Version|Status):'
          want="$(node -p "require('./package.json').version")"
          got="$(dpkg-query -W -f='${Version}' ithil-prototype)"
          echo "version in package.json: $want, installed: $got"
          test "$got" = "$want"
          ithil-selftest
          test -f /opt/ithil/docs/mockups/ithil-app.html
          # no services, timers or startup entries were added
          ! dpkg -L ithil-prototype | grep -E '/(systemd|init\.d|cron|autostart)/'
          # remember every path the package owns, remove it, check each one is gone
          dpkg -L ithil-prototype | grep -E '^/(opt/ithil|usr/bin/ithil-|usr/share/applications/ithil-)' > owned.txt
          echo "package owns $(wc -l < owned.txt) paths"
          sudo dpkg -r ithil-prototype
          left=0; while read -r p; do if [ -e "$p" ]; then echo "still there: $p"; left=1; fi; done < owned.txt
          test "$left" = 0
          test ! -e /opt/ithil
          ! dpkg -s ithil-prototype 2>/dev/null | grep -q '^Status: install ok installed'
      - uses: actions/upload-artifact@v4
        with:
          name: ithil-prototype-deb
          path: dist/*.deb
          if-no-files-found: error
