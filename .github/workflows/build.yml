name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Her event log works inside Electron (node:sqlite)
        run: |
          ELECTRON_RUN_AS_NODE=1 npx electron -e "const { DatabaseSync } = require('node:sqlite'); const d = new DatabaseSync(':memory:'); d.exec('CREATE TABLE t (x); INSERT INTO t VALUES (1)'); if (d.prepare('SELECT x FROM t').get().x !== 1) process.exit(1); console.log('node:sqlite works in Electron, Node', process.versions.node)" \
            || { echo "::error::node:sqlite is not available in this Electron: her event log would stay off"; exit 1; }
      - run: npm run bundle
      - name: Build AppImage and .deb
        run: npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-ai-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error
